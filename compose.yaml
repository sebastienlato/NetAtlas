name: netatlas
services:
  db:
    build:
      context: ./docker
      dockerfile: Dockerfile.postgis
    image: netatlas-postgis:18.3-3.6.4
    # Local VM budget, bounded logs, and no SQL/parameter-bearing error logs.
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - postgres
      - -c
      - log_min_messages=panic
      - -c
      - log_min_error_statement=panic
      - -c
      - log_statement=none
      - -c
      - log_parameter_max_length_on_error=0
    environment:
      POSTGRES_DB: netatlas
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres-password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d netatlas"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
secrets:
  postgres-password:
    file: ./data/storage/postgres-password
volumes:
  postgres-data:
