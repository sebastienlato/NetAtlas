# Phase 0 validates these settings but contains NO network measurement engine.
[api]
host = "127.0.0.1"
port = 8000

[measurement]
enabled = false
node_id = "local-dev"
operator_contact = ""
user_agent = "NetAtlas/0.1 (research; measurement disabled)"
connect_timeout_seconds = 3.0
interaction_timeout_seconds = 5.0
max_concurrency = 32
global_connections_per_second = 10.0
per_prefix_connections_per_second = 1.0
max_response_bytes = 65536
exclusion_cidrs = []

[logging]
level = "INFO"
